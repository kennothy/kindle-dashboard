name: Build Kindle dashboard

on:
  schedule:
    - cron: "3 * * * *"   # every hour, at 3 minutes past
  workflow_dispatch:       # lets you run it by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Render images
        run: node render/render.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - id: deploy
        uses: actions/deploy-pages@v4

      # GitHub pauses hourly jobs in repos with no activity for 60 days.
      # This makes a tiny empty commit once a month so it keeps running.
      - name: Keep schedule alive
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( now - last )) -gt $(( 40 * 86400 )) ]; then
            git config user.name "dashboard-bot"
            git config user.email "dashboard-bot@users.noreply.github.com"
            git commit --allow-empty -m "Keep hourly schedule active"
            git push
          fi
